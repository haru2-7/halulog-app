<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ハルログ">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#fbf7ed">
  <meta name="description" content="一日を4時間ずつの小さな区画に分けて予定と記録を残す、個人用の時間ログアプリです。">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <title>ハルログ｜いまなにしてる？</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>ハルログ</h1>
      <p class="subtitle">いまなにしてる？</p>
      <div class="today" id="todayText" aria-live="polite"></div>
    </header>

    <main>
      <section id="yesterdaySection" hidden aria-labelledby="yesterdayTitle">
        <details class="review-card" id="yesterdayReview">
          <summary>
            <span class="summary-main">
              <span id="yesterdayTitle">昨日どうだった？</span>
              <span class="summary-date" id="yesterdayDateText"></span>
            </span>
            <span class="summary-status" id="reviewStatus">30秒で振り返り</span>
          </summary>

          <div class="review-body">
            <div class="previous-plan">
              <p class="previous-plan-title">昨日の予定</p>
              <div id="previousPlanContent"></div>
            </div>

            <fieldset>
              <legend>進み具合</legend>
              <div class="choice-grid">
                <label class="choice">
                  <input type="radio" name="reviewResult" value="予定どおり">
                  <span>予定どおり</span>
                </label>
                <label class="choice">
                  <input type="radio" name="reviewResult" value="少し進んだ">
                  <span>少し進んだ</span>
                </label>
                <label class="choice">
                  <input type="radio" name="reviewResult" value="ほぼ進まず">
                  <span>ほぼ進まず</span>
                </label>
                <label class="choice">
                  <input type="radio" name="reviewResult" value="休んだ">
                  <span>休んだ</span>
                </label>
              </div>
            </fieldset>

            <fieldset>
              <legend>作業時間</legend>
              <div class="choice-grid">
                <label class="choice">
                  <input type="radio" name="reviewDuration" value="〜2h">
                  <span>〜2h</span>
                </label>
                <label class="choice">
                  <input type="radio" name="reviewDuration" value="2〜4h">
                  <span>2〜4h</span>
                </label>
                <label class="choice">
                  <input type="radio" name="reviewDuration" value="4〜6h">
                  <span>4〜6h</span>
                </label>
                <label class="choice">
                  <input type="radio" name="reviewDuration" value="6〜8h">
                  <span>6〜8h</span>
                </label>
                <label class="choice">
                  <input type="radio" name="reviewDuration" value="8h〜">
                  <span>8h〜</span>
                </label>
              </div>
            </fieldset>

            <label class="review-note">
              ひとこと <span class="detail-hint">任意</span>
              <input id="reviewNote" type="text" autocomplete="off" placeholder="例：ここまで進んだ／資料探しで詰まった">
            </label>

            <div class="review-actions">
              <button id="completeReviewButton" type="button">昨日を記録して今日へ</button>
              <button class="secondary-button" id="skipReviewButton" type="button">今日はスキップ</button>
            </div>
          </div>
        </details>
      </section>

      <section aria-labelledby="scheduleTitle">
        <details class="schedule-details" id="scheduleDetails">
          <summary>
            <span class="summary-main">
              <span id="scheduleTitle">スケジュールの材料</span>
              <span class="summary-date">やりたい・やる必要・動かせない予定</span>
            </span>
            <span class="detail-hint">日をまたいで保存</span>
          </summary>

          <div class="schedule-body">
            <p class="schedule-note">材料だけ置けば大丈夫。仮スケジュールは、相談したあとに入れます。</p>

            <label>
              やりたいこと
              <textarea id="scheduleWants" placeholder="例：個人作品を進める／絵の研究／片付け／行きたい場所"></textarea>
            </label>

            <label>
              やらなければいけないこと（締め切り含む）
              <textarea id="scheduleMusts" placeholder="例：○/○ 原稿提出／デザイン修正／返信"></textarea>
            </label>

            <label>
              予定と休み
              <textarea id="scheduleFixed" placeholder="例：毎週○曜は休み／○/○ 打ち合わせ／外出翌日は回復日"></textarea>
            </label>

            <label>
              相談して決めた仮スケジュール <span class="detail-hint">相談結果</span>
              <textarea id="scheduleDraft" placeholder="ここは、材料とその日の状態を見ながら決めた予定を入れます"></textarea>
            </label>
          </div>
        </details>
      </section>

      <section id="todayStart" aria-labelledby="dayTitle">
        <h2 class="section-title" id="dayTitle">今日の入り口</h2>
        <div class="field-group">
          <label>
            起床
            <input id="wake" type="text" autocomplete="off" placeholder="例：8:20">
          </label>
          <label>
            ボディバッテリー
            <input id="battery" type="text" inputmode="numeric" autocomplete="off" placeholder="例：42">
          </label>
          <label>
            今日の予定
            <textarea id="plan" placeholder="今日ありそうなことを軽く"></textarea>
          </label>
        </div>
      </section>

      <section aria-labelledby="dayPlanTitle">
        <h2 class="section-title" id="dayPlanTitle">4つの小さな一日</h2>
        <p class="section-note">起床の1時間後から4時間ずつ。ひと区画うまくいかなくても、次から再開。</p>
        <div class="day-list" id="dayList"></div>
      </section>

      <section aria-labelledby="logTitle">
        <details class="hour-details">
          <summary>
            <span id="logTitle">1時間ごとの観察メモ</span>
            <span class="detail-hint">必要な日だけ</span>
          </summary>
          <div class="hour-list" id="hourList"></div>
        </details>
      </section>

      <div class="actions">
        <button id="copyButton" type="button">ログをコピー</button>
        <p class="message" id="message" aria-live="polite"></p>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
