<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ハルログ">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#fbf7ed">
  <meta name="description" content="一日を4時間ずつの小さな区画に分けて予定と記録を残す、個人用の時間ログアプリです。">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <title>ハルログ｜いまなにしてる？</title>
  <style>
    :root {
      --paper: #fffdf7;
      --cream: #fbf7ed;
      --ink: #2f2a24;
      --muted: #756d62;
      --line: #e8dcc9;
      --field: #fffaf1;
      --accent: #8b6f47;
      --accent-dark: #6f5633;
      --accent-soft: #f1e6d4;
      --shadow: 0 1px 0 rgba(86, 67, 40, 0.08);
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      background: var(--cream);
    }

    body {
      min-height: 100%;
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.7), rgba(251, 247, 237, 0.95)),
        var(--cream);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "YuGothic", "Noto Sans JP", sans-serif;
      font-size: 16px;
      line-height: 1.65;
    }

    .app {
      width: min(100%, 720px);
      margin: 0 auto;
      padding: max(22px, env(safe-area-inset-top)) 18px max(30px, env(safe-area-inset-bottom));
    }

    header { padding: 10px 2px 18px; }

    h1 {
      margin: 0;
      font-size: 26px;
      font-weight: 700;
    }

    .subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .today {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      margin-top: 16px;
      padding: 4px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 253, 247, 0.76);
      color: var(--accent-dark);
      font-size: 15px;
      box-shadow: var(--shadow);
    }

    main {
      display: grid;
      gap: 18px;
      padding-bottom: 8px;
    }

    section { padding: 0; }

    .section-title {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    .section-note {
      margin: -2px 0 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .field-group,
    .day-list,
    .hour-list {
      display: grid;
      gap: 12px;
    }

    label {
      display: grid;
      gap: 7px;
      color: var(--ink);
      font-size: 15px;
      font-weight: 650;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--field);
      color: var(--ink);
      font: inherit;
      box-shadow: var(--shadow);
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }

    input {
      min-height: 50px;
      padding: 12px 13px;
    }

    textarea {
      min-height: 86px;
      padding: 12px 13px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-color: #c5a778;
      background: #fffdf8;
      box-shadow: 0 0 0 3px rgba(197, 167, 120, 0.22);
    }

    .day-card {
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255, 253, 247, 0.72);
      box-shadow: var(--shadow);
    }

    .day-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .day-number {
      color: var(--ink);
      font-size: 15px;
      font-weight: 700;
    }

    .day-time {
      color: var(--accent-dark);
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }

    .day-card textarea {
      min-height: 76px;
      background: var(--paper);
    }

    .review-card,
    .hour-details {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255, 253, 247, 0.82);
      box-shadow: var(--shadow);
    }

    .review-card > summary,
    .hour-details > summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 58px;
      padding: 12px 14px;
      color: var(--ink);
      font-weight: 700;
      cursor: pointer;
      list-style: none;
      -webkit-tap-highlight-color: transparent;
    }

    .review-card > summary::-webkit-details-marker,
    .hour-details > summary::-webkit-details-marker {
      display: none;
    }

    .summary-main {
      display: grid;
      gap: 1px;
    }

    .summary-date,
    .summary-status,
    .detail-hint {
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }

    .summary-status {
      color: var(--accent-dark);
      white-space: nowrap;
    }

    .review-body {
      display: grid;
      gap: 16px;
      padding: 0 14px 15px;
      border-top: 1px solid rgba(232, 220, 201, 0.78);
    }

    .previous-plan {
      margin-top: 14px;
      padding: 12px;
      border-radius: 9px;
      background: var(--accent-soft);
    }

    .previous-plan-title {
      margin: 0 0 5px;
      color: var(--accent-dark);
      font-size: 13px;
      font-weight: 700;
    }

    .previous-plan-list {
      display: grid;
      gap: 4px;
      margin: 0;
      padding-left: 1.2em;
      font-size: 14px;
    }

    .previous-plan-empty {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    fieldset {
      min-width: 0;
      margin: 0;
      padding: 0;
      border: 0;
    }

    legend {
      margin-bottom: 8px;
      color: var(--ink);
      font-size: 15px;
      font-weight: 700;
    }

    .choice-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .choice {
      position: relative;
      display: block;
      font-weight: 600;
    }

    .choice input {
      position: absolute;
      width: 1px;
      height: 1px;
      min-height: 0;
      margin: 0;
      padding: 0;
      opacity: 0;
      pointer-events: none;
    }

    .choice span {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 9px 8px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--paper);
      color: var(--ink);
      font-size: 14px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .choice input:focus-visible + span {
      box-shadow: 0 0 0 3px rgba(197, 167, 120, 0.22);
    }

    .choice input:checked + span {
      border-color: #b99661;
      background: var(--accent-soft);
      color: var(--accent-dark);
      font-weight: 700;
    }

    .review-note input {
      background: var(--paper);
    }

    .review-actions {
      display: grid;
      gap: 8px;
    }

    button {
      width: 100%;
      min-height: 52px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #fffdf8;
      font: inherit;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(71, 52, 26, 0.18);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:active {
      transform: translateY(1px);
      background: var(--accent-dark);
    }

    .secondary-button {
      min-height: 44px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      box-shadow: none;
      font-size: 14px;
    }

    .secondary-button:active {
      background: var(--accent-soft);
      color: var(--accent-dark);
    }

    .hour-details[open] > summary {
      border-bottom: 1px solid var(--line);
    }

    .hour-details .hour-list {
      padding: 13px;
    }

    .hour-row {
      display: grid;
      grid-template-columns: 62px 1fr;
      gap: 10px;
      align-items: start;
      scroll-margin-bottom: 90px;
    }

    .hour {
      padding-top: 11px;
      color: var(--accent-dark);
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
    }

    .actions {
      position: sticky;
      bottom: 0;
      z-index: 2;
      margin: 4px -18px 0;
      padding: 12px 18px calc(12px + env(safe-area-inset-bottom));
      background: linear-gradient(180deg, rgba(251, 247, 237, 0), rgba(251, 247, 237, 0.96) 22%, var(--cream));
    }

    .message {
      min-height: 24px;
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
    }

    [hidden] { display: none !important; }

    @media (max-width: 380px) {
      .app {
        padding-left: 14px;
        padding-right: 14px;
      }

      .hour-row {
        grid-template-columns: 56px 1fr;
        gap: 8px;
      }

      h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>ハルログ</h1>
      <p class="subtitle">いまなにしてる？</p>
      <div class="today" id="todayText" aria-live="polite"></div>
    </header>

    <main>
      <section id="yesterdaySection" hidden aria-labelledby="yesterdayTitle">
        <details class="review-card" id="yesterdayReview">
          <summary>
            <span class="summary-main">
              <span id="yesterdayTitle">昨日どうだった？</span>
              <span class="summary-date" id="yesterdayDateText"></span>
            </span>
            <span class="summary-status" id="reviewStatus">30秒で振り返り</span>
          </summary>

          <div class="review-body">
            <div class="previous-plan">
              <p class="previous-plan-title">昨日の予定</p>
              <div id="previousPlanContent"></div>
            </div>

            <fieldset>
              <legend>進み具合</legend>
              <div class="choice-grid">
                <label class="choice">
                  <input type="radio" name="reviewResult" value="予定どおり">
                  <span>予定どおり</span>
                </label>
                <label class="choice">
                  <input type="radio" name="reviewResult" value="少し進んだ">
                  <span>少し進んだ</span>
                </label>
                <label class="choice">
                  <input type="radio" name="reviewResult" value="ほぼ進まず">
                  <span>ほぼ進まず</span>
                </label>
                <label class="choice">
                  <input type="radio" name="reviewResult" value="休んだ">
                  <span>休んだ</span>
                </label>
              </div>
            </fieldset>

            <fieldset>
              <legend>作業時間</legend>
              <div class="choice-grid">
                <label class="choice">
                  <input type="radio" name="reviewDuration" value="〜2h">
                  <span>〜2h</span>
                </label>
                <label class="choice">
                  <input type="radio" name="reviewDuration" value="2〜4h">
                  <span>2〜4h</span>
                </label>
                <label class="choice">
                  <input type="radio" name="reviewDuration" value="4〜6h">
                  <span>4〜6h</span>
                </label>
                <label class="choice">
                  <input type="radio" name="reviewDuration" value="6〜8h">
                  <span>6〜8h</span>
                </label>
                <label class="choice">
                  <input type="radio" name="reviewDuration" value="8h〜">
                  <span>8h〜</span>
                </label>
              </div>
            </fieldset>

            <label class="review-note">
              ひとこと <span class="detail-hint">任意</span>
              <input id="reviewNote" type="text" autocomplete="off" placeholder="例：19pまで修正／資料探しで詰まった">
            </label>

            <div class="review-actions">
              <button id="completeReviewButton" type="button">昨日を記録して今日へ</button>
              <button class="secondary-button" id="skipReviewButton" type="button">今日はスキップ</button>
            </div>
          </div>
        </details>
      </section>

      <section id="todayStart" aria-labelledby="dayTitle">
        <h2 class="section-title" id="dayTitle">今日の入り口</h2>
        <div class="field-group">
          <label>
            起床
            <input id="wake" type="text" autocomplete="off" placeholder="例：8:20">
          </label>
          <label>
            ボディバッテリー
            <input id="battery" type="text" inputmode="numeric" autocomplete="off" placeholder="例：42">
          </label>
          <label>
            今日の予定
            <textarea id="plan" placeholder="今日ありそうなことを軽く"></textarea>
          </label>
        </div>
      </section>

      <section aria-labelledby="dayPlanTitle">
        <h2 class="section-title" id="dayPlanTitle">4つの小さな一日</h2>
        <p class="section-note">起床の1時間後から4時間ずつ。ひと区画うまくいかなくても、次から再開。</p>
        <div class="day-list" id="dayList"></div>
      </section>

      <section aria-labelledby="logTitle">
        <details class="hour-details">
          <summary>
            <span id="logTitle">1時間ごとの観察メモ</span>
            <span class="detail-hint">必要な日だけ</span>
          </summary>
          <div class="hour-list" id="hourList"></div>
        </details>
      </section>

      <div class="actions">
        <button id="copyButton" type="button">ログをコピー</button>
        <p class="message" id="message" aria-live="polite"></p>
      </div>
    </main>
  </div>

  <script>
    (() => {
      const hours = Array.from({ length: 16 }, (_, index) => index + 7);
      const dayPlans = Array.from({ length: 4 }, (_, index) => index);
      const fields = ["wake", "battery", "plan"];
      const today = new Date();
      const previousDate = new Date(today);
      previousDate.setDate(previousDate.getDate() - 1);

      const dateKey = formatDate(today, "-");
      const previousDateKey = formatDate(previousDate, "-");
      const storageKey = `halulog:${dateKey}`;
      const previousStorageKey = `halulog:${previousDateKey}`;
      const todayLabel = formatDate(today, "/");
      const previousDateLabel = formatDate(previousDate, "/");

      const dayList = document.getElementById("dayList");
      const hourList = document.getElementById("hourList");
      const message = document.getElementById("message");
      const yesterdaySection = document.getElementById("yesterdaySection");
      const yesterdayReview = document.getElementById("yesterdayReview");
      const reviewStatus = document.getElementById("reviewStatus");
      const previousPlanContent = document.getElementById("previousPlanContent");

      document.getElementById("todayText").textContent = `今日：${todayLabel}`;
      document.getElementById("yesterdayDateText").textContent = previousDateLabel;

      dayPlans.forEach((index) => {
        const card = document.createElement("div");
        card.className = "day-card";

        const heading = document.createElement("div");
        heading.className = "day-heading";

        const number = document.createElement("div");
        number.className = "day-number";
        number.textContent = `第${index + 1}日`;

        const time = document.createElement("div");
        time.className = "day-time";
        time.id = `day-time-${index}`;

        const textarea = document.createElement("textarea");
        textarea.id = `day-plan-${index}`;
        textarea.dataset.dayPlan = String(index);
        textarea.setAttribute("aria-label", `第${index + 1}日の予定`);
        textarea.placeholder = "この4時間の主目的をひとつ";

        heading.append(number, time);
        card.append(heading, textarea);
        dayList.append(card);
      });

      hours.forEach((hour) => {
        const row = document.createElement("div");
        row.className = "hour-row";

        const time = document.createElement("div");
        time.className = "hour";
        time.textContent = `${hour}:00`;

        const textarea = document.createElement("textarea");
        textarea.id = `hour-${hour}`;
        textarea.dataset.hour = String(hour);
        textarea.setAttribute("aria-label", `${hour}:00 のメモ`);
        textarea.placeholder = "やったことだけ";

        row.append(time, textarea);
        hourList.append(row);
      });

      const data = loadData(storageKey);
      const previousData = loadData(previousStorageKey);
      restoreData(data);
      setupYesterdayReview(data.yesterdayReview || {}, previousData);

      document.addEventListener("input", saveFromEvent);
      document.addEventListener("change", saveFromEvent);

      document.getElementById("completeReviewButton").addEventListener("click", () => {
        yesterdayReview.dataset.completed = "true";
        yesterdayReview.dataset.skipped = "false";
        yesterdayReview.open = false;
        reviewStatus.textContent = "記録済み";
        saveData();
        document.getElementById("todayStart").scrollIntoView({ behavior: "smooth", block: "start" });
        window.setTimeout(() => document.getElementById("wake").focus(), 350);
      });

      document.getElementById("skipReviewButton").addEventListener("click", () => {
        yesterdayReview.dataset.completed = "true";
        yesterdayReview.dataset.skipped = "true";
        yesterdayReview.open = false;
        reviewStatus.textContent = "スキップ済み";
        saveData();
        document.getElementById("todayStart").scrollIntoView({ behavior: "smooth", block: "start" });
      });

      document.getElementById("copyButton").addEventListener("click", async () => {
        const text = buildCopyText();

        try {
          await copyText(text);
          showMessage("コピーしました");
        } catch (error) {
          showMessage("コピーできませんでした。本文を選んでコピーしてください。");
        }
      });

      function saveFromEvent(event) {
        if (event.target.id === "wake") {
          updateDayTimes();
        }

        if (event.target.matches("input, textarea")) {
          const saved = saveData();
          showMessage(saved ? "保存しました" : "保存できませんでした", 900);
        }
      }

      function formatDate(date, separator) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}${separator}${month}${separator}${day}`;
      }

      function loadData(key) {
        try {
          return JSON.parse(localStorage.getItem(key)) || {};
        } catch (error) {
          return {};
        }
      }

      function restoreData(saved) {
        fields.forEach((id) => {
          document.getElementById(id).value = saved[id] || "";
        });

        dayPlans.forEach((index) => {
          document.getElementById(`day-plan-${index}`).value = saved.dayPlans?.[index] || "";
        });

        hours.forEach((hour) => {
          document.getElementById(`hour-${hour}`).value = saved.logs?.[hour] || "";
        });

        updateDayTimes();
      }

      function setupYesterdayReview(savedReview, savedPreviousData) {
        if (!hasMeaningfulLog(savedPreviousData)) {
          yesterdaySection.hidden = true;
          return;
        }

        yesterdaySection.hidden = false;
        renderPreviousPlan(savedPreviousData);

        setCheckedValue("reviewResult", savedReview.result || "");
        setCheckedValue("reviewDuration", savedReview.duration || "");
        document.getElementById("reviewNote").value = savedReview.note || "";

        const isForPreviousDate = !savedReview.previousDate || savedReview.previousDate === previousDateKey;
        const completed = isForPreviousDate && Boolean(savedReview.completed);
        const skipped = completed && Boolean(savedReview.skipped);

        yesterdayReview.dataset.completed = String(completed);
        yesterdayReview.dataset.skipped = String(skipped);
        yesterdayReview.open = !completed;
        reviewStatus.textContent = completed ? (skipped ? "スキップ済み" : "記録済み") : "30秒で振り返り";
      }

      function hasMeaningfulLog(saved) {
        if (!saved || typeof saved !== "object") return false;
        if ([saved.wake, saved.battery, saved.plan].some(hasText)) return true;
        if (Object.values(saved.dayPlans || {}).some(hasText)) return true;
        return Object.values(saved.logs || {}).some(hasText);
      }

      function hasText(value) {
        return String(value || "").trim().length > 0;
      }

      function renderPreviousPlan(saved) {
        previousPlanContent.replaceChildren();
        const items = [];

        if (hasText(saved.plan)) {
          items.push(saved.plan.trim());
        }

        dayPlans.forEach((index) => {
          const text = saved.dayPlans?.[index];
          if (!hasText(text)) return;
          const timeLabel = getDayTimeLabelFromWake(saved.wake, index);
          items.push(`第${index + 1}日（${timeLabel}） ${text.trim()}`);
        });

        if (items.length === 0) {
          const empty = document.createElement("p");
          empty.className = "previous-plan-empty";
          empty.textContent = "予定の記録はありません";
          previousPlanContent.append(empty);
          return;
        }

        const list = document.createElement("ul");
        list.className = "previous-plan-list";
        items.forEach((text) => {
          const item = document.createElement("li");
          item.textContent = text;
          list.append(item);
        });
        previousPlanContent.append(list);
      }

      function setCheckedValue(name, value) {
        document.querySelectorAll(`input[name="${name}"]`).forEach((input) => {
          input.checked = input.value === value;
        });
      }

      function getCheckedValue(name) {
        return document.querySelector(`input[name="${name}"]:checked`)?.value || "";
      }

      function collectData() {
        const plannedDays = {};
        dayPlans.forEach((index) => {
          plannedDays[index] = document.getElementById(`day-plan-${index}`).value;
        });

        const logs = {};
        hours.forEach((hour) => {
          logs[hour] = document.getElementById(`hour-${hour}`).value;
        });

        return {
          wake: document.getElementById("wake").value,
          battery: document.getElementById("battery").value,
          plan: document.getElementById("plan").value,
          dayPlans: plannedDays,
          logs,
          yesterdayReview: {
            previousDate: previousDateKey,
            result: getCheckedValue("reviewResult"),
            duration: getCheckedValue("reviewDuration"),
            note: document.getElementById("reviewNote").value,
            completed: yesterdayReview.dataset.completed === "true",
            skipped: yesterdayReview.dataset.skipped === "true"
          }
        };
      }

      function saveData() {
        try {
          localStorage.setItem(storageKey, JSON.stringify(collectData()));
          return true;
        } catch (error) {
          return false;
        }
      }

      function buildCopyText() {
        const current = collectData();
        const lines = [];

        if (current.yesterdayReview.completed && !current.yesterdayReview.skipped) {
          lines.push(
            "【昨日の振り返り】",
            `日付：${previousDateLabel}`,
            `昨日の予定：${previousData.plan || ""}`,
            `進み具合：${current.yesterdayReview.result}`,
            `作業時間：${current.yesterdayReview.duration}`,
            `ひとこと：${current.yesterdayReview.note}`,
            ""
          );
        }

        lines.push(
          "【ハルログ】",
          `今日：${todayLabel}`,
          `起床：${current.wake}`,
          `ボディバッテリー：${current.battery}`,
          `今日の予定：${current.plan}`,
          "",
          "【4つの小さな一日】"
        );

        dayPlans.forEach((index) => {
          lines.push(`第${index + 1}日（${getDayTimeLabel(index)}）　${current.dayPlans[index]}`);
        });

        lines.push("", "【1時間ごとの観察メモ】");

        hours.forEach((hour) => {
          lines.push(`${hour}:00　${current.logs[hour]}`);
        });

        return lines.join("\n");
      }

      function updateDayTimes() {
        dayPlans.forEach((index) => {
          document.getElementById(`day-time-${index}`).textContent = getDayTimeLabel(index);
        });
      }

      function getDayTimeLabel(index) {
        return getDayTimeLabelFromWake(document.getElementById("wake").value, index);
      }

      function getDayTimeLabelFromWake(wakeValue, index) {
        const wakeMinutes = parseTime(wakeValue);
        const firstStart = (wakeMinutes ?? 390) + 60;
        const start = firstStart + index * 240;
        const end = start + 240;
        return `${formatClock(start)}〜${formatClock(end)}`;
      }

      function parseTime(value) {
        const match = String(value).trim().match(/^(\d{1,2}):(\d{2})$/);
        if (!match) return null;

        const hour = Number(match[1]);
        const minute = Number(match[2]);
        if (hour > 23 || minute > 59) return null;
        return hour * 60 + minute;
      }

      function formatClock(totalMinutes) {
        const dayOffset = Math.floor(totalMinutes / 1440);
        const normalized = ((totalMinutes % 1440) + 1440) % 1440;
        const hour = Math.floor(normalized / 60);
        const minute = String(normalized % 60).padStart(2, "0");
        return `${dayOffset > 0 ? "翌 " : ""}${hour}:${minute}`;
      }

      async function copyText(text) {
        if (navigator.clipboard && window.isSecureContext) {
          try {
            await navigator.clipboard.writeText(text);
            return;
          } catch (error) {
            // Safariで許可されない時は下の方法を試す
          }
        }

        const helper = document.createElement("textarea");
        helper.value = text;
        helper.setAttribute("readonly", "");
        helper.style.fontSize = "16px";
        helper.style.position = "fixed";
        helper.style.top = "0";
        helper.style.left = "0";
        helper.style.width = "1px";
        helper.style.height = "1px";
        helper.style.opacity = "0.01";
        document.body.append(helper);
        helper.focus();
        helper.select();
        helper.setSelectionRange(0, helper.value.length);
        const copied = document.execCommand("copy");
        helper.remove();

        if (!copied) {
          throw new Error("Copy failed");
        }
      }

      function showMessage(text, duration = 1800) {
        message.textContent = text;
        window.clearTimeout(showMessage.timer);
        showMessage.timer = window.setTimeout(() => {
          message.textContent = "";
        }, duration);
      }
    })();
  </script>
</body>
</html>
